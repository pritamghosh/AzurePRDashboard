server:
  port: 8080

spring:
  application:
    name: azure-dashboard
  profiles:
    active: local

  # Allows the application to import additional config files.
  # application-local.yml is gitignored and holds the real PAT.
  config:
    import: "optional:classpath:application-local.yml"

azure:
  devops:
    # ⚠ Do NOT put your real PAT here — use application-local.yml or azuredashboard.ps1 instead.
    pat: ""
    # ⚠ Set organization and project in azuredashboard.ps1 or application-local.yml
    organization: ""
    project: ""
    # General REST API version.
    api-version: "7.1"
    # Policy evaluations API requires the preview flag — kept separate so it can be
    # updated independently when the endpoint graduates to GA.
    policy-api-version: "7.1-preview.1"
    # Set to true in application-local.yml to log every WebClient request URL and
    # response status at DEBUG level. Keep false in production.
    debug-logging: true

    # Repository grouping — define groups by name + list of repo name prefixes.
    # Matching is case-insensitive.  First matching group wins.
    # Repos that match no prefix appear in an "Other" catch-all group.
    # Add your real groups in application-local.yml.
    #
    # Example:
    #   repository-groups:
    #     - name: "Borders"
    #       prefixes:
    #         - "borders-"
    #         - "brd-"
    #     - name: "Infrastructure"
    #       prefixes:
    #         - "infra-"
    #         - "platform-"


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.pritamghosh.azuredashboard: info
    # Set to DEBUG during development to see WebClient request/response details
    # org.springframework.web.reactive.function.client: DEBUG

